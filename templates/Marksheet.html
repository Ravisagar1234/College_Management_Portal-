{% extends "base.html" %}
{% load static %}
{% block content %}
  <!-- Header -->
  <section class="contact-hero">
    <h1>Marksheet</h1>
     <section class="contact-wrap">
    
      <form  method="POST" class="contact-form" id="contactForm" >
        {% csrf_token %}
        <label style=" padding-left:150px; " >Englis marks</label>
        <input type="text" placeholder="Enter marks?" name="num1"/ class='form-control'/ >

        <label style=" padding-left:150px; ">Hindi marks</label>
        <input type="text" placeholder="Enter marks?" name="num2"/ class='form-control'/ >

        <label style=" padding-left:150px; " >Maths marks</label>
        <input type="text" placeholder="Enter marks?" name="num3"/ class='form-control'/ >

        <label style=" padding-left:150px; " >Science marks</label>
        <input type="text" placeholder="Enter marks?" name="num4" class='form-control'/ >

        <label style=" padding-left:120px; ">Social Science marks</label>
        <input type="text" placeholder="Enter marks?" name="num5" class='form-control'/ >

        <label style=" padding-left:150px; " >Drawing marks</label>
        <input type="text" placeholder="Enter marks?" name="num6" class='form-control'/ >


        {% comment %} <button type='submitted' class='form-control'>calculate</button><br> {% endcomment %}
        <button type='submit'>ADD MARKS</button><br>
        <label  style=" padding-left:150px; ">Total</label>
        <input type="text" value='{{Total}}' name='num7' class='form-control'/>

        <label style=" padding-left:150px; ">Percentage</label>
        <input type="text"  value='{{Percentage}}' placeholder="Your Percentage is !" name="num8" class='form-control'/ >

        <label style=" padding-left:150px; ">Division</label>
        <input type="text" value='{{Division}}' placeholder="Your Division is !" name="num9" class='form-control'/ >
      </form>  
     
     
  </section>
{% endblock %}
  <!-- Footer -->
{% block scripts %}
  <script src="{% static 'JS/form.js' %}"></script>
{% endblock %}     
</body>
</html>
